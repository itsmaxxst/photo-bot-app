<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Editor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --lock-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Верхняя панель (Header) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--bg-color);
            z-index: 10;
        }
        .icon-btn {
            background: none; border: none; color: white;
            font-size: 24px; cursor: pointer; padding: 0;
        }
        .top-badges {
            display: flex; gap: 5px; background: #222;
            border-radius: 15px; padding: 3px;
        }
        .badge {
            font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 12px; color: #888;
            cursor: pointer;
        }
        .badge.active { background: white; color: black; }

        /* Контейнер фото */
        .photo-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        #photo-preview {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            transition: filter 0.1s;
        }
        .placeholder-text {
            color: var(--text-muted); font-size: 16px;
            position: absolute; cursor: pointer; padding: 20px; z-index: 5;
        }

        /* Редактор (нижняя часть) */
        .editor-panel {
            background: var(--bg-color);
            padding-bottom: 20px; /* Safe area */
            display: flex; flex-direction: column;
        }

        /* Саб-табы (ВСЕ ИНСТРУМЕНТЫ, САМОЕ НУЖНОЕ и т.д.) */
        .sub-tabs {
            display: flex; gap: 15px; padding: 10px 15px;
            overflow-x: auto; white-space: nowrap;
            border-bottom: 1px solid #222;
        }
        .sub-tabs::-webkit-scrollbar { display: none; }
        .sub-tab {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); padding: 6px 12px; border-radius: 4px; cursor: pointer;
        }
        .sub-tab.active { background: white; color: black; }

        /* Горизонтальный скролл для пресетов и инструментов */
        .items-scroll {
            display: flex; gap: 15px; padding: 20px 15px;
            overflow-x: auto; white-space: nowrap;
            min-height: 80px; align-items: flex-end;
        }
        .items-scroll::-webkit-scrollbar { display: none; }

        /* Дизайн пресетов */
        .preset-item {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
            position: relative;
        }
        .preset-thumb {
            width: 60px; height: 60px; background-color: #222;
            border-radius: 2px 2px 0 0; background-size: cover; background-position: center;
        }
        .preset-label {
            width: 60px; text-align: center; font-size: 10px; font-weight: bold;
            padding: 4px 0; border-radius: 0 0 2px 2px; color: black;
        }
        .lock-icon {
            position: absolute; top: 4px; right: 4px;
            background: rgba(0,0,0,0.5); border-radius: 50%; width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
        .fav-icon {
            position: absolute; top: 4px; left: 4px;
            width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            color: gold; text-shadow: 0 0 2px black;
        }

        /* Дизайн инструментов */
        .tool-item {
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            position: relative; width: 65px;
        }
        .tool-icon {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid #fff;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .tool-name {
            font-size: 10px; color: white; white-space: normal; text-align: center; line-height: 1.1;
        }
        .tool-item .lock-icon { top: -5px; right: 5px; }

        /* Панель активного слайдера */
        .slider-panel {
            display: none; padding: 20px; flex-direction: column; align-items: center;
        }
        .slider-panel.active { display: flex; }
        .slider-label { font-size: 12px; margin-bottom: 15px; }
        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: transparent; margin-bottom: 20px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px;
            border-radius: 50%; background: white; cursor: pointer; margin-top: -8px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #444; border-radius: 2px;
        }
        .slider-actions { display: flex; justify-content: space-between; width: 100%; }
        .action-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        /* Нижняя навигация (Табы переключения разделов) */
        .bottom-nav {
            display: flex; justify-content: space-around; padding: 15px 0 25px 0;
            border-top: 1px solid #111;
        }
        .nav-item {
            color: #555; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nav-item.active { color: white; }

        /* Утилиты */
        .hidden { display: none !important; }
        .locked { opacity: 0.7; }
        
        
        /* Оверлей для сохранения (fallback) */
        #save-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #save-overlay.active { display: flex; }
        #save-overlay img { max-width: 90%; max-height: 80%; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .save-hint { color: white; margin-top: 25px; font-size: 16px; font-weight: bold; text-align: center; }
        .close-overlay { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; border: none; background: none; cursor: pointer; padding: 10px; }

        /* Скрытый canvas для экспорта */
        #export-canvas { display: none; }
    </style>
</head>
<body>

<input type="file" id="upload" accept="image/*" class="hidden">
<canvas id="export-canvas"></canvas>

<!-- Оверлей для 100% сохранения на iOS -->
<div id="save-overlay">
    <button class="close-overlay" onclick="document.getElementById('save-overlay').classList.remove('active')">✕</button>
    <img id="export-preview" src="">
    <div class="save-hint">👆 Удерживайте фото, чтобы сохранить в галерею</div>
</div>


<header class="top-bar">
    <div class="top-badges" id="hdr-sdr-toggle">
        <span class="badge" data-mode="HDR">HDR</span>
        <span class="badge active" data-mode="SDR">SDR</span>
    </div>
    <div style="display: flex; gap: 15px;">
        <button class="icon-btn" onclick="document.getElementById('upload').click()" title="Загрузить фото"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
        <button class="icon-btn" id="btn-save" title="Сохранить"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
    </div>
</header>

<main class="photo-area" id="photo-container">
    <div class="placeholder-text" id="placeholder" onclick="document.getElementById('upload').click()">Нажмите здесь, чтобы загрузить фото</div>
    <img id="photo-preview" src="" class="hidden">
</main>

<section class="editor-panel">
    <div class="slider-panel" id="slider-panel">
        <div class="slider-label" id="slider-tool-name">Настройка</div>
        <input type="range" id="active-slider" min="50" max="150" value="100">
        <div class="slider-actions">
            <button class="action-btn" id="btn-cancel-tool">✕</button>
            <button class="action-btn" id="btn-apply-tool">✓</button>
        </div>
    </div>

    <div id="selection-panel">
        <div class="sub-tabs" id="sub-tabs-container">
            <!-- Заполняется JS (Вкладки) -->
        </div>
        <div class="items-scroll" id="items-container">
            <!-- Заполняется JS (Пресеты или Инструменты) -->
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-tab="presets"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
        <div class="nav-item" data-tab="tools"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></div>
    </nav>
</section>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    const urlParams = new URLSearchParams(window.location.search);
    const isPremium = urlParams.get('premium') === '1';

    const upload = document.getElementById('upload');
    const preview = document.getElementById('photo-preview');
    const placeholder = document.getElementById('placeholder');
    const container = document.getElementById('photo-container');
    
    const subTabsContainer = document.getElementById('sub-tabs-container');
    const itemsContainer = document.getElementById('items-container');
    const navItems = document.querySelectorAll('.nav-item');

    const selectionPanel = document.getElementById('selection-panel');
    const sliderPanel = document.getElementById('slider-panel');
    const activeSlider = document.getElementById('active-slider');
    const sliderToolName = document.getElementById('slider-tool-name');
    
    const btnSave = document.getElementById('btn-save');
    const exportCanvas = document.getElementById('export-canvas');
    const hdrSdrBadges = document.querySelectorAll('#hdr-sdr-toggle .badge');

    let currentSettings = {
        brightness: 100, contrast: 100, saturate: 100, hue: 0,
        presetFilter: '' 
    };
    let activeToolKey = null;
    let isHolding = false;
    let exportMode = 'SDR';
    let currentTab = 'presets'; // 'presets' или 'favorites'
    
    // Загрузка избранного из localStorage (или пустой массив)
    let favoritePresets = JSON.parse(localStorage.getItem('favoritePresets')) || [];

    const presetsData = [
        { id: 'none', name: 'ORIG', color: '#999', filter: 'none', isPro: false },
        { id: 'g3', name: 'G3', color: '#cddc39', filter: 'contrast(110%) saturate(120%)', isPro: false },
        { id: 'hb2', name: 'HB2', color: '#90caf9', filter: 'contrast(120%) saturate(80%) brightness(95%)', isPro: false },
        { id: 'a1', name: 'A1 PRO', color: '#e57373', filter: 'sepia(30%) contrast(110%) brightness(105%)', isPro: true },
        { id: 'c8', name: 'C8 PRO', color: '#ffb74d', filter: 'contrast(130%) saturate(140%) hue-rotate(-10deg)', isPro: true },
        { id: 'g6', name: 'G6 PRO', color: '#ffeb3b', filter: 'brightness(110%) contrast(105%) saturate(130%)', isPro: true },
        { id: 'm5', name: 'M5 PRO', color: '#4db6ac', filter: 'saturate(60%) contrast(120%) sepia(20%)', isPro: true },
    ];

    const toolsData = [
        { id: 'brightness', name: 'Экспозиция', icon: '☀', min: 50, max: 150, def: 100, isPro: false },
        { id: 'contrast', name: 'Контраст', icon: '◐', min: 50, max: 150, def: 100, isPro: false },
        { id: 'saturate', name: 'Насыщенность', icon: '⏺', min: 0, max: 200, def: 100, isPro: true },
        { id: 'hue', name: 'Тон', icon: 'H', min: 0, max: 360, def: 0, isPro: true }
    ];

    // --- Переключение HDR/SDR ---
    hdrSdrBadges.forEach(badge => {
        badge.addEventListener('click', () => {
            hdrSdrBadges.forEach(b => b.classList.remove('active'));
            badge.classList.add('active');
            exportMode = badge.getAttribute('data-mode');
        });
    });

    // --- Избранное (Добавление/Удаление) ---
    window.toggleFavorite = function(event, id) {
        event.stopPropagation(); // Чтобы не применялся сам пресет
        if (id === 'none') return; // Оригинал нельзя добавить в избранное
        
        const index = favoritePresets.indexOf(id);
        if (index > -1) {
            favoritePresets.splice(index, 1);
        } else {
            favoritePresets.push(id);
        }
        localStorage.setItem('favoritePresets', JSON.stringify(favoritePresets));
        renderPresets(currentTab); // Перерисовываем текущую вкладку
    };

    // --- Логика рендера UI ---
    function renderPresets(tab = 'presets') {
        currentTab = tab;
        subTabsContainer.innerHTML = `
            <div class="sub-tab ${tab === 'presets' ? 'active' : ''}" onclick="renderPresets('presets')">ПРЕСЕТЫ</div>
            <div class="sub-tab ${tab === 'favorites' ? 'active' : ''}" onclick="renderPresets('favorites')">ИЗБРАННОЕ</div>
        `;
        
        itemsContainer.innerHTML = '';
        
        let presetsToShow = presetsData;
        if (tab === 'favorites') {
            presetsToShow = presetsData.filter(p => favoritePresets.includes(p.id));
            if (presetsToShow.length === 0) {
                itemsContainer.innerHTML = '<div style="color: #888; font-size: 12px; margin: auto;">Нет избранных пресетов</div>';
                return;
            }
        }

        presetsToShow.forEach(p => {
            const isLocked = p.isPro && !isPremium;
            const bgImg = preview.src ? `background-image: url(${preview.src});` : '';
            const isFav = favoritePresets.includes(p.id);
            const favIcon = p.id !== 'none' ? `<div class="fav-icon" onclick="toggleFavorite(event, '${p.id}')">${isFav ? '★' : '☆'}</div>` : '';
            
            itemsContainer.innerHTML += `
                <div class="preset-item ${isLocked ? 'locked' : ''}" onclick="applyPreset('${p.id}')">
                    <div class="preset-thumb" style="${bgImg} filter: ${p.filter};"></div>
                    <div class="preset-label" style="background-color: ${p.color};">${p.name}</div>
                    ${favIcon}
                    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
                </div>
            `;
        });
    }

    function renderTools() {
        subTabsContainer.innerHTML = `<div class="sub-tab active">ВСЕ ИНСТРУМЕНТЫ</div>`;
        itemsContainer.innerHTML = '';
        toolsData.forEach(t => {
            const isLocked = t.isPro && !isPremium;
            itemsContainer.innerHTML += `
                <div class="tool-item ${isLocked ? 'locked' : ''}" onclick="openTool('${t.id}')">
                    <div class="tool-icon">${t.icon}</div>
                    <div class="tool-name">${t.name}</div>
                    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
                </div>
            `;
        });
    }

    // --- Взаимодействие с инструментами ---
    window.applyPreset = function(id) {
        const p = presetsData.find(x => x.id === id);
        if (p.isPro && !isPremium) {
            if(tg.showAlert) tg.showAlert("Этот пресет доступен только в Premium версии.");
            else alert("Этот пресет доступен только в Premium версии.");
            return;
        }
        
        currentSettings.presetFilter = p.filter === 'none' ? '' : p.filter;
        updatePhotoFilter();
    };

    window.openTool = function(id) {
        const t = toolsData.find(x => x.id === id);
        if (t.isPro && !isPremium) {
            if(tg.showAlert) tg.showAlert("Этот инструмент доступен только в Premium версии.");
            else alert("Этот инструмент доступен только в Premium версии.");
            return;
        }

        activeToolKey = id;
        sliderToolName.innerText = t.name;
        activeSlider.min = t.min;
        activeSlider.max = t.max;
        activeSlider.value = currentSettings[id];
        
        selectionPanel.classList.add('hidden');
        sliderPanel.classList.add('active');
    };

    document.getElementById('btn-cancel-tool').onclick = () => closeSlider();
    document.getElementById('btn-apply-tool').onclick = () => closeSlider();

    activeSlider.addEventListener('input', (e) => {
        if(activeToolKey) {
            currentSettings[activeToolKey] = e.target.value;
            updatePhotoFilter();
        }
    });

    function closeSlider() {
        sliderPanel.classList.remove('active');
        selectionPanel.classList.remove('hidden');
        activeToolKey = null;
    }

    // --- Применение фильтров ---
    function updatePhotoFilter() {
        if (isHolding) {
            preview.style.filter = 'none';
        } else {
            const b = currentSettings.brightness;
            const c = currentSettings.contrast;
            const s = currentSettings.saturate;
            const h = currentSettings.hue;
            let filterStr = currentSettings.presetFilter + ` brightness(${b}%) contrast(${c}%) saturate(${s}%) hue-rotate(${h}deg)`;
            preview.style.filter = filterStr;
        }
    }

    // --- Переключение нижних вкладок ---
    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            const tab = item.getAttribute('data-tab');
            if(!tab) return;
            navItems.forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            if (tab === 'presets') renderPresets('presets');
            if (tab === 'tools') renderTools();
        });
    });

    // --- Загрузка фото ---
    upload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                if(document.querySelector('.nav-item.active').getAttribute('data-tab') === 'presets') {
                    renderPresets(currentTab);
                }
            }
            reader.readAsDataURL(file);
        }
    });

    // --- Логика "Удерживай для оригинала" ---
    container.addEventListener('pointerdown', () => { if(preview.src) { isHolding = true; updatePhotoFilter(); } });
    container.addEventListener('pointerup', () => { isHolding = false; updatePhotoFilter(); });
    container.addEventListener('pointerleave', () => { isHolding = false; updatePhotoFilter(); });
    container.addEventListener('contextmenu', e => e.preventDefault());

    // --- Сохранение/Экспорт фото (с поддержкой iOS) ---
    btnSave.addEventListener('click', () => {
        if (!preview.src || preview.src === window.location.href) {
            if(tg.showAlert) tg.showAlert("Сначала загрузите фото!");
            else alert("Сначала загрузите фото!");
            return;
        }

        const ctx = exportCanvas.getContext('2d');
        
        // Используем изображение напрямую, без асинхронного onload, чтобы сохранить User Gesture контекст
        exportCanvas.width = preview.naturalWidth;
        exportCanvas.height = preview.naturalHeight;
        ctx.filter = preview.style.filter;
        ctx.drawImage(preview, 0, 0, exportCanvas.width, exportCanvas.height);
        
        let quality = exportMode === 'HDR' ? 1.0 : 0.8;
        const fileName = `edited_photo_${exportMode}_${Date.now()}.jpg`;

        exportCanvas.toBlob(async (blob) => {
            if (!blob) return;
            const file = new File([blob], fileName, { type: 'image/jpeg' });

            // Способ 1: Нативный Share API (Вызывает шторку iOS 'Сохранить изображение')
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Фото из редактора'
                    });
                    return; // Успех, выходим
                } catch (error) {
                    if (error.name === 'AbortError') return; // Юзер сам закрыл шторку
                    console.log('Share API error:', error);
                }
            }
            
            // Способ 2: Скачивание (Работает на Android и Telegram Desktop)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIOS) {
                const dataUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(dataUrl);
                if(tg.showAlert) tg.showAlert("Фото сохранено!");
                return;
            }

            // Способ 3: Железобетонный fallback для iOS, если Share API заблокирован WebView
            const dataUrlBase64 = exportCanvas.toDataURL('image/jpeg', quality);
            document.getElementById('export-preview').src = dataUrlBase64;
            document.getElementById('save-overlay').classList.add('active');

        }, 'image/jpeg', quality);
    });

    renderPresets();
</script>
</body>
</html>
